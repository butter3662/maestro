<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a1a1f"/>
      <stop offset=".55" stop-color="#24100f"/>
      <stop offset="1" stop-color="#0e0908"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3a8"/>
      <stop offset=".5" stop-color="#e2b866"/>
      <stop offset="1" stop-color="#a87a35"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7c27d" stop-opacity="0"/>
      <stop offset=".6" stop-color="#e7c27d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff2cc" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe9"/>
      <stop offset=".35" stop-color="#ffe7a8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 스포트라이트 -->
  <path d="M206 0 H306 L430 512 H82 Z" fill="#ffe6b0" opacity=".06"/>
  <!-- 3박 지휘 도형 궤적 -->
  <path d="M96 250 C70 360, 150 420, 236 392 C320 364, 410 380, 418 318 C426 250, 380 200, 342 150"
        fill="none" stroke="url(#trail)" stroke-width="16" stroke-linecap="round"/>
  <!-- 지휘봉 -->
  <g transform="rotate(38 256 256)">
    <rect x="250" y="120" width="12" height="230" rx="6" fill="url(#gold)"/>
    <rect x="243" y="330" width="26" height="74" rx="13" fill="#f3ead8"/>
    <rect x="243" y="330" width="26" height="10" rx="5" fill="#c9a15a"/>
  </g>
  <!-- 지휘봉 끝 빛 -->
  <circle cx="340" cy="149" r="40" fill="url(#glow)"/>
  <!-- 바닥 금색 라인 -->
  <rect x="0" y="470" width="512" height="42" fill="#0b0706"/>
  <rect x="0" y="466" width="512" height="5" fill="#c9a15a" opacity=".8"/>
</svg>
