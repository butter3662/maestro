<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maestro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120d0b">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>마에스트로 — 틀린 단원을 찾아라</title>
<style>
:root{--bg:#120d0b;--panel:#1d1512;--line:#3a2a22;--gold:#e7c27d;--gold2:#b8904a;--txt:#f3e9dc;--dim:#a8968a;--good:#7fd99a;--bad:#ff7a6b;--warn:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- 메뉴 ---------- */
#menu{max-width:620px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-family:"Times New Roman",serif;font-size:34px;margin:6px 0 2px;color:var(--gold);letter-spacing:1px}
.sub{color:var(--dim);margin:0 0 20px;font-size:14px}
h2{font-size:15px;color:var(--gold);margin:22px 0 10px;font-weight:600}
.cards{display:grid;gap:10px}
.card{display:block;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2a1f18}
.card b{font-size:16px}
.card .meta{color:var(--dim);font-size:13px;margin-top:3px}
.card .best{float:right;color:var(--gold2);font-size:12px}
.diffs{grid-template-columns:repeat(3,1fr)}
.diffs .card{text-align:center;padding:12px 6px}
#diffInfo{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.55}
#startBtn{margin-top:22px;width:100%;padding:15px;border-radius:14px;border:0;background:linear-gradient(#f0cf8e,#c99a4f);color:#2b1a0c;font-weight:700;font-size:17px}
details{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{color:var(--gold);font-weight:600}
details p,details li{color:#d8cabd;font-size:14px;line-height:1.6}
details ul{padding-left:18px;margin:6px 0}
.ver{color:#6e5d52;font-size:12px;text-align:center;margin-top:20px}
/* ---------- 게임 ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:none;user-select:none;-webkit-user-select:none}
#hud{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 12px 6px;background:#0d0908;border-bottom:1px solid var(--line);font-size:13px}
#hudTitle{font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudScore{text-align:right;font-variant-numeric:tabular-nums}
#hudScore b{font-size:16px;color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;color:var(--dim)}
.row .v{color:var(--txt);font-weight:600}
.ok{color:var(--good)!important}.ng{color:var(--warn)!important}
#dynBox{display:flex;align-items:center;gap:6px}
#dynMark{font-family:"Times New Roman",serif;font-style:italic;font-weight:700;font-size:17px;color:var(--txt);min-width:24px}
#meter{position:relative;width:86px;height:8px;border-radius:4px;background:#2c211b;overflow:visible}
#meterFill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#6c8bd8,#e7c27d,#ff7a6b)}
#meterTarget{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff}
#quitBtn{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--dim);font-size:12px}
#stage{position:relative;flex:1 1 58%;min-height:260px;overflow:hidden;background:linear-gradient(#0b0706 0 41%,#3a2213 41%,#5e3a1d 60%,#6a4222 100%);--dyn:.45}
/* 뒷벽: 나무 패널 + 몰딩 */
.wall{position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.15) 70%,rgba(0,0,0,.45)),
  repeating-linear-gradient(90deg,#4a2c18 0 44px,#3a2213 44px 47px,#55331c 47px 48px);}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(#7a5530,#2a170c);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pipes{position:absolute;left:30%;right:30%;top:6%;height:30%;opacity:.35;
  background:repeating-linear-gradient(90deg,transparent 0 5px,#c9a15a 5px 9px,transparent 9px 14px);
  -webkit-mask:linear-gradient(to top,#000 0,#000 40%,transparent 100%);mask:linear-gradient(to top,#000,transparent);
  clip-path:polygon(0 60%,15% 30%,30% 15%,50% 0,70% 15%,85% 30%,100% 60%,100% 100%,0 100%)}
/* 바닥: 원근 나무 마루 */
.floor{position:absolute;left:-60%;right:-60%;bottom:-2%;height:75%;transform:perspective(520px) rotateX(46deg);transform-origin:50% 100%;
  background:linear-gradient(rgba(58,34,19,1),rgba(0,0,0,0) 35%),
  repeating-linear-gradient(90deg,#7a4b26 0 34px,#6a3f1f 34px 35px,#83532b 35px 70px,#5f381b 70px 71px)}
.floor::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10%;background:linear-gradient(transparent,rgba(231,194,125,.18))}
/* 조명 */
.spot{position:absolute;top:-8%;height:112%;width:46%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(rgba(255,236,190,.55),rgba(255,226,170,.08) 85%);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);opacity:calc(.18 + var(--dyn)*.42);transition:opacity .3s}
.spot.s1{left:-6%;transform:rotate(-12deg)}.spot.s2{left:27%}.spot.s3{right:-6%;transform:rotate(12deg)}
.bulbs{position:absolute;left:12%;right:12%;top:9%;height:6px;background:radial-gradient(circle,#fff6d8 0 2px,rgba(255,220,150,.4) 3px,transparent 5px) 0 0/34px 6px repeat-x;z-index:6;opacity:.9}
/* 커튼 */
.curtain{position:absolute;top:0;bottom:0;width:9%;z-index:6;
  background:repeating-linear-gradient(90deg,#4a0a10 0,#8c1a24 7px,#b02a33 9px,#6e131b 12px,#4a0a10 16px);
  box-shadow:inset -10px 0 18px rgba(0,0,0,.6)}
.curtain.l{left:0;border-bottom-right-radius:60% 12%}.curtain.r{right:0;transform:scaleX(-1);border-bottom-right-radius:60% 12%}
.valance{position:absolute;left:0;right:0;top:0;height:9%;z-index:7;
  background:repeating-linear-gradient(90deg,#5a0e15 0,#9c2029 8px,#5a0e15 16px);
  -webkit-mask:radial-gradient(circle at 50% 0,#000 70%,transparent 72%) 0 0/28px 100% repeat-x, linear-gradient(#000 0 55%,transparent 55%);mask:radial-gradient(circle at 50% 0,#000 70%,transparent 72%) 0 0/28px 100% repeat-x, linear-gradient(#000 0 55%,transparent 55%);
  border-top:3px solid #c9a15a}
/* 단원 */
.seat{position:absolute;width:66px;text-align:center;touch-action:none;transform:translate(-50%,-62%) scale(var(--sc,1));z-index:3;--lv:0}
.seat .pool{position:absolute;left:-30%;right:-30%;bottom:6px;height:34px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,214,140,.9),rgba(255,190,110,.25) 45%,transparent 70%);opacity:calc(.12 + var(--lv)*.8);pointer-events:none}
.seat svg{position:relative;width:66px;height:78px;display:block;margin:0 auto;overflow:visible}
.seat .sheet{fill:#e9dfc8;filter:brightness(calc(.55 + var(--lv)*.6))}
.seat .head{transition:filter .08s;filter:brightness(calc(.7 + var(--lv)*.5))}
.seat .ins{position:absolute;right:-4px;top:20px;font-size:21px;filter:drop-shadow(0 1px 2px #000)}
.seat .lab{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#2b1a0c;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000}
.seat .nm{position:relative;font-size:10px;color:#e8dccb;margin-top:-2px;line-height:1.15;white-space:nowrap;text-shadow:0 1px 3px #000}
.seat.wob svg{animation:wob .3s infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.seat.hit .pool{background:radial-gradient(ellipse,rgba(127,217,154,.95),transparent 70%);opacity:1}
.seat.miss .pool{background:radial-gradient(ellipse,rgba(255,122,107,.95),transparent 70%);opacity:1}
.pop{position:absolute;z-index:8;transform:translate(-50%,-50%);font-weight:800;font-size:14px;white-space:nowrap;pointer-events:none;animation:pop 1.3s ease-out forwards;text-shadow:0 1px 3px #000}
.pop.good{color:var(--good)}.pop.bad{color:var(--bad)}.pop.miss{color:var(--warn)}
@keyframes pop{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-46px}}
#count{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800;color:var(--gold);pointer-events:none;text-shadow:0 2px 12px #000}
#warn{position:absolute;z-index:9;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:4px 10px;border-radius:10px;font-size:12px;color:var(--warn);pointer-events:none}
#padWrap{position:relative;flex:1 1 30%;min-height:160px;border-top:7px solid #2a170c;box-shadow:inset 0 1px 0 #7a5530;background:radial-gradient(ellipse at 50% 0,#22170f,#0d0907 75%)}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#padHint{position:absolute;left:0;right:0;top:8px;text-align:center;color:#8a7766;font-size:12px;pointer-events:none}
#beatNo{position:absolute;right:12px;bottom:10px;font-size:26px;font-weight:800;color:#3d2e25;pointer-events:none;font-variant-numeric:tabular-nums}
/* ---------- 결과 ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.grade{font-family:"Times New Roman",serif;font-size:64px;color:var(--gold);text-align:center;line-height:1;margin:4px 0 6px}
.formula{text-align:center;font-family:"Times New Roman",serif;font-size:18px;margin:8px 0 14px}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td{padding:6px 2px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.res .tot td{font-weight:800;color:var(--gold);font-size:16px;border-bottom:0}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#2a1f18}
.btns button.pri{background:linear-gradient(#f0cf8e,#c99a4f);color:#2b1a0c;border:0;font-weight:700}
.note{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.5}
#acct button{background:#2a1f18;border:1px solid var(--line);border-radius:10px;padding:6px 11px;color:var(--txt)}
#acct .who{color:var(--gold);font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{position:relative}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:4px 0 16px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:16px;padding:13px 0}
.song{cursor:pointer}
.song .diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.song .dbtn{background:#1a1310;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.song .dbtn.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2a1f18}
.song .dbtn small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.song .dbtn .bs{color:var(--gold2)}
.song .go{margin-top:10px;width:100%;padding:13px;border-radius:12px;border:0;background:linear-gradient(#f0cf8e,#c99a4f);color:#2b1a0c;font-weight:700;font-size:16px}
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:40px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:rgba(13,9,8,.94);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
#tabbar button{background:none;border:0;color:var(--dim);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
#tabbar button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6}
#tabbar button.on{color:var(--gold)}#tabbar button.on i{filter:none;opacity:1}
#acct{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#2a1f18;color:var(--dim)}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.field input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#120d0b;color:var(--txt);font-size:16px}
.msg{min-height:18px;font-size:13px;margin:4px 0 0;line-height:1.45}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.linkbtn{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:12px;padding:6px 0}
</style>
</head>
<body>

<section id="menu">
  <div id="tabSongs">
    <div class="search"><span>🔍</span><input id="q" type="search" placeholder="곡 검색 — 제목·작곡가" autocomplete="off"></div>
    <div class="cards" id="songCards"></div>
    <p id="noRes" class="note hidden" style="text-align:center">검색 결과가 없다.</p>
  </div>
  <div id="tabSet" class="hidden">
    <h2 style="margin-top:6px">계정</h2>
    <div class="card" id="acct"></div>
    <h2>소리</h2>
    <label class="card" style="display:flex;align-items:center;gap:12px"><input type="checkbox" id="spatial" style="width:22px;height:22px;accent-color:#c99a4f"><span><b>공간 음향(서라운드)</b><div class="meta">이어폰 전용. 지휘대에 선 위치에서 각 단원 소리가 앞·좌우·거리감 있게 들린다. 스피커로 들을 때는 끄는 게 낫다.</div></span></label>
    <label class="card" style="display:flex;align-items:center;gap:12px;margin-top:10px"><input type="checkbox" id="tickOn" style="width:22px;height:22px;accent-color:#c99a4f"><span><b>지휘 박 소리</b><div class="meta">박을 저을 때마다 '딱' 소리가 나서 내가 친 박이 들린다. 1박은 조금 높은 소리.</div></span></label>
    <div class="ver">Maestro v0.2.3</div>
  </div>
  <nav id="tabbar"><button data-tab="songs" class="on"><i>🎼</i>곡</button><button data-tab="set"><i>⚙️</i>설정</button></nav>
</section>

<section id="game" class="hidden">
  <header id="hud">
    <div id="hudTitle">—</div>
    <div id="hudScore">S <b id="sTot">0</b></div>
    <div class="row">
      <span>템포 <span class="v" id="tCur">—</span> / 목표 <span class="v" id="tTgt">—</span></span>
      <span id="dynBox"><span id="dynMark">p</span><span id="meter"><span id="meterFill"></span><span id="meterTarget"></span></span></span>
    </div>
    <div class="row" style="justify-content:flex-end"><span id="barNo">—</span><button id="quitBtn">그만</button></div>
  </header>
  <div id="stage"><div class="wall"><div class="pipes"></div></div><div class="floor"></div><div class="spot s1"></div><div class="spot s2"></div><div class="spot s3"></div><div class="curtain l"></div><div class="curtain r"></div><div class="valance"></div><div class="bulbs"></div><div id="count"></div><div id="warn" class="hidden">오케스트라가 지휘를 기다린다 — 박을 저어라</div></div>
  <div id="padWrap"><canvas id="pad"></canvas><div id="padHint">지휘대 · 아래로 내려쳤다 튕겨 올리기</div><div id="beatNo"></div></div>
</section>

<div id="result" class="modal hidden"><div class="box" id="resBox"></div></div>
<div id="auth" class="modal hidden"><div class="box" id="authBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
'use strict';
/* =========================================================
   1. 음 이름 · 화음 파서
   ========================================================= */
const PCS={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiOf(s){
  const m=/^([A-G])(#|b)?(\d)$/.exec(s);
  if(!m) throw new Error('음 이름 오류: '+s);
  return (+m[3]+1)*12+PCS[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);   // C4 = 60
}
// "G5:1' A4:.5~" → 음:길이(4분음표=1), ' = 스타카토, ~ = 다음 음과 붙임줄
function parseBar(str){
  return str.trim().split(/\s+/).map(tok=>{
    let tie=false,st=false;
    if(tok.endsWith('~')){tie=true;tok=tok.slice(0,-1);}
    if(tok.endsWith("'")){st=true;tok=tok.slice(0,-1);}
    const [n,d]=tok.split(':');
    return {m:n==='r'?null:midiOf(n),d:parseFloat(d),tie,st};
  });
}
const QUAL={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'7b9':[0,4,7,10,13]};
function parseChord(s){
  const m=/^([A-G])(#|b)?(.*)$/.exec(s);
  if(!m||!QUAL[m[3]]) throw new Error('화음 오류: '+s);
  return {root:(PCS[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12,ints:QUAL[m[3]]};
}
const DYN={pp:.12,p:.3,mp:.45,mf:.6,f:.8,ff:1};

/* =========================================================
   2. 곡 데이터 (게임용 편곡)
   행 = [선율, 화음(공백으로 마디 균등 분할), 셈여림, 목표 템포]
   셈여림·템포는 생략하면 앞 마디 값을 이어받는다.
   ========================================================= */
function rows(list){let d='p',tp=60;return list.map(r=>{if(r[2])d=r[2];if(r[3])tp=r[3];return {m:r[0],c:r[1],d,tp};});}

// --- 파헬벨: 카논 D장조 (4/4, 박 단위 = 4분음표) ---
const C1='D A Bm F#m',C2='G D G A';
const V1=['F#5:1 E5:1 D5:1 C#5:1','B4:1 A4:1 B4:1 C#5:1'];
const V2=['D5:1 C#5:1 B4:1 A4:1','G4:1 F#4:1 G4:1 E4:1'];
const V3=['D4:.5 F#4:.5 A4:.5 G4:.5 F#4:.5 D4:.5 F#4:.5 E4:.5','D4:.5 B3:.5 D4:.5 A4:.5 G4:.5 B4:.5 A4:.5 G4:.5'];
const V3H=['D5:.5 F#5:.5 A5:.5 G5:.5 F#5:.5 D5:.5 F#5:.5 E5:.5','D5:.5 B4:.5 D5:.5 A5:.5 G5:.5 B5:.5 A5:.5 G5:.5'];
const CANON={
  id:'canon',title:'카논 D장조',composer:'J. 파헬벨',meterTxt:'4/4',beatSym:'♩',kw:'canon pachelbel 파헬벨 캐논',
  qPerBar:4,qPerBeat:1,countIn:4,key:2,style:'block',bassLo:42,fl:{delay:8},har:{delay:16},
  bars:rows([
    ['r:4',C1,'p',60],['r:4',C2],
    [V1[0],C1],[V1[1],C2],
    [V2[0],C1,'mp'],[V2[1],C2],
    [V3[0],C1,'mf'],[V3[1],C2],
    [V1[0],C1],[V1[1],C2],
    [V2[0],C1,'f'],[V2[1],C2],

/* =========================================================
   4. 편곡 컴파일: 곡 + 난이도 → 단원별 연주 이벤트
   ========================================================= */
function compile(song,diff){
  const bars=song.bars,Q=song.qPerBar,endQ=bars.length*Q;
  // 선율(붙임줄 처리)
  const mel=[];let q=0,pend=null;
  bars.forEach((b,bi)=>{
    let sum=0;
    parseBar(b.m).forEach(t=>{
      if(t.m===null){pend=null;}
      else if(pend&&pend.m===t.m){pend.d+=t.d;if(!t.tie)pend=null;}
      else{const n={q:q+sum,d:t.d,m:t.m,st:t.st};mel.push(n);pend=t.tie?n:null;}
      sum+=t.d;
    });
    if(Math.abs(sum-Q)>1e-6) console.warn('마디 길이 오류',song.id,bi+1,sum);
    q+=Q;
  });
  // 화음
  const chords=[];
  bars.forEach((b,bi)=>{const cs=b.c.split(/\s+/),dq=Q/cs.length;cs.forEach((c,i)=>chords.push({q:bi*Q+i*dq,dq,...parseChord(c)}));});
  const chordAt=qq=>{let r=chords[0];for(const c of chords){if(c.q<=qq+1e-9)r=c;else break;}return r;};
  const pcsOf=c=>c.ints.map(i=>(c.root+i)%12);
  const place=(pc,lo)=>lo+(((pc-lo%12)%12)+12)%12;           // lo 이상에서 가장 낮은 그 음
  const dynOf=bi=>DYN[bars[bi].d];
  const lines={};
  lines.mel=mel.map(n=>({...n,v:.8}));
  const harmBelow=n=>{const pcs=pcsOf(chordAt(n.q));for(let x=n.m-3;x>=n.m-10&&x>=55;x--)if(pcs.includes(x%12))return x;return null;};
  const voice=(spec,kind)=>{
    const out=[],lastQ=endQ-Q;
    const fb=kind==='fl'?n=>({...n,m:n.m+12<=96?n.m+12:n.m}):n=>{const x=harmBelow(n);return x==null?null:{...n,m:x};};
    if(spec&&spec.delay){
      mel.forEach(n=>{const nq=n.q+spec.delay;if(nq+1e-9<lastQ)out.push({...n,q:nq,d:Math.min(n.d,lastQ-nq)});});
      mel.filter(n=>n.q>=lastQ-1e-9).forEach(n=>{const r=fb(n);if(r)out.push(r);});
    }else mel.forEach(n=>{const r=fb(n);if(r)out.push(r);});
    return out.map(n=>({...n,v:kind==='fl'?.6:.55}));
  };
  lines.fl=voice(song.fl,'fl');
  lines.har=voice(song.har,'har');
  lines.bass=chords.map(c=>({q:c.q,d:song.style==='waltz'?Math.min(c.dq,1.5):c.dq*.95,m:place(c.root,song.bassLo),v:.75}));
  lines.cb=lines.bass.map(n=>({...n,m:n.m-12>=28?n.m-12:n.m,v:.8}));
  const voicing=c=>pcsOf(c).map(pc=>place(pc,55)).sort((a,b)=>a-b);
  lines.pno=[];
  if(song.style==='waltz') chords.forEach(c=>{
    lines.pno.push({q:c.q,d:.9,m:place(c.root,36),v:.7,ci:0,kind:'bass'});
    for(let k=1;k<3;k++) voicing(c).forEach((m,i)=>lines.pno.push({q:c.q+k,d:.7,m,v:.42,ci:i,kind:'ch'}));
  });
  else chords.forEach(c=>voicing(c).forEach((m,i)=>lines.pno.push({q:c.q,d:c.dq*.9,m,v:.42,ci:i,kind:'ch'})));
  lines.tpt=[];
  const step=Q===4?2:3;
  for(let qq=0;qq<endQ;qq+=step){
    const bi=Math.floor(qq/Q);if(dynOf(bi)<.59)continue;
    const c=chordAt(qq);lines.tpt.push({q:qq,d:step*.92,m:place((c.root+c.ints[1])%12,62),v:.5});
  }
  lines.timp=[];lines.perc=[];
  bars.forEach((b,bi)=>{
    if(dynOf(bi)<.79)return;
    const c=chordAt(bi*Q);
    if(c.root===song.key||c.root===(song.key+7)%12) lines.timp.push({q:bi*Q,d:1,m:place(c.root,40),v:.8});
    lines.perc.push({q:bi*Q,d:1,m:-1,v:.8});
    if(bi===0||dynOf(bi-1)<.79) lines.perc.push({q:bi*Q,d:2,m:-2,v:.6});
  });
  // 좌석 & 이벤트
  const letters='ABCDEFGHIJK';
  const seats=LAYOUT[diff].map((s,i)=>({inst:s[0],role:s[1],pan:s[2],row:s[3],label:letters[i],cents:(i%3-1)*4,vx:s[4]!=null?s[4]:s[2]}));
  const qpb=song.qPerBeat,events=[];
  seats.forEach((s,si)=>lines[s.role].forEach(n=>{
    const dPlay=n.st?Math.min(n.d*.55,.3):n.d*.95;
    events.push({seat:si,b:n.q/qpb,dp:dPlay/qpb,m:n.m,v:n.v,ci:n.ci,kind:n.kind});
  }));
  events.sort((a,b)=>a.b-b.b||a.seat-b.seat);
  return {seats,events,totalBeats:endQ/qpb,barDyn:bars.map(b=>DYN[b.d])};
}

/* =========================================================
   5. 소리 합성 (Web Audio)
   ========================================================= */
let ctx,master,revIn,noiseBuf;
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  master=ctx.createGain();master.gain.value=.85;master.connect(comp);comp.connect(ctx.destination);
  const n=Math.floor(ctx.sampleRate*2.2),imp=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
  const conv=ctx.createConvolver();conv.buffer=imp;const wet=ctx.createGain();wet.gain.value=.22;
  revIn=ctx.createGain();revIn.connect(conv);conv.connect(wet);wet.connect(master);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function adsr(t,att,peak,end,rel){const g=ctx.createGain();const e=Math.max(t+att,end);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setValueAtTime(peak,e);g.gain.linearRampToValueAtTime(0,e+rel);return g;}
function lfoTo(param,t,stop,rate,depth,delay){const l=ctx.createOscillator(),g=ctx.createGain();l.frequency.value=rate;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(depth,t+delay+.25);l.connect(g);g.connect(param);l.start(t);l.stop(stop);}
function bowed(t,f,dur,v,out,o,cents){
  const end=t+dur,stop=end+o.rel+.05,g=adsr(t,o.att,o.peak*v,end,o.rel);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.cut*(.55+.9*v);lp.Q.value=.8;
  [0,o.det].forEach(dc=>{const s=ctx.createOscillator();s.type='sawtooth';s.frequency.value=f;s.detune.value=dc+cents;
    if(dur>.25)lfoTo(s.frequency,t,stop,5.6,f*.0055,.12);s.connect(lp);s.start(t);s.stop(stop);});
  lp.connect(g);g.connect(out);
}
function piano(t,f,dur,v,out){
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32*v,t+.006);
  g.gain.setTargetAtTime(0,t+.006,f<220?.7:.4);g.gain.setTargetAtTime(0,t+dur,.09);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(5000,t);lp.frequency.setTargetAtTime(1400,t,.3);
  const a=ctx.createOscillator();a.type='triangle';a.frequency.value=f;
  const b=ctx.createOscillator();b.frequency.value=f*2;const bg=ctx.createGain();bg.gain.value=.3;
  const c=ctx.createOscillator();c.type='sawtooth';c.frequency.value=f;c.detune.value=4;const cg=ctx.createGain();cg.gain.value=.12;
  a.connect(lp);b.connect(bg);bg.connect(lp);c.connect(cg);cg.connect(lp);lp.connect(g);g.connect(out);
  [a,b,c].forEach(o=>{o.start(t);o.stop(t+dur+.6);});
}
function flute(t,f,dur,v,out){
  const end=t+dur,stop=end+.15,g=adsr(t,.05,.3*v,end,.1);
  const a=ctx.createOscillator();a.frequency.value=f;
  const b=ctx.createOscillator();b.type='triangle';b.frequency.value=f*2;const bg=ctx.createGain();bg.gain.value=.08;
  if(dur>.25)lfoTo(a.frequency,t,stop,5,f*.006,.15);
  const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=Math.min(f*2,12000);bp.Q.value=3;
  const ng=ctx.createGain();ng.gain.value=.05;n.connect(bp);bp.connect(ng);ng.connect(g);
  a.connect(g);b.connect(bg);bg.connect(g);g.connect(out);
  [a,b,n].forEach(o=>{o.start(t);o.stop(stop);});
}
function trumpet(t,f,dur,v,out){
  const end=t+dur,stop=end+.12,g=adsr(t,.03,.2*v,end,.08);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.5;
  lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500+3000*v,t+.05);lp.frequency.linearRampToValueAtTime(1000+1600*v,t+.3);
  const s=ctx.createOscillator();s.type='sawtooth';s.frequency.value=f;if(dur>.3)lfoTo(s.frequency,t,stop,5.2,f*.003,.25);
  s.connect(lp);lp.connect(g);g.connect(out);s.start(t);s.stop(stop);
}
function timpani(t,f,v,out){
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.7*v,t+.005);g.gain.setTargetAtTime(0,t+.01,.45);
  const s=ctx.createOscillator();s.frequency.setValueAtTime(f*1.03,t);s.frequency.exponentialRampToValueAtTime(f,t+.12);
  const s2=ctx.createOscillator();s2.frequency.value=f*1.5;const g2=ctx.createGain();g2.gain.value=.25;
  const n=ctx.createBufferSource();n.buffer=noiseBuf;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  const ng=ctx.createGain();ng.gain.setValueAtTime(.35*v,t);ng.gain.exponentialRampToValueAtTime(.001,t+.08);
  n.connect(lp);lp.connect(ng);ng.connect(out);s.connect(g);s2.connect(g2);g2.connect(g);g.connect(out);
  [s,s2,n].forEach(o=>{o.start(t);o.stop(t+2.2);});
}
function bdrum(t,v,out){const s=ctx.createOscillator();s.frequency.setValueAtTime(95,t);s.frequency.exponentialRampToValueAtTime(42,t+.3);const g=ctx.createGain();g.gain.setValueAtTime(.95*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);s.connect(g);g.connect(out);s.start(t);s.stop(t+.55);}
function cymbal(t,v,out){const n=ctx.createBufferSource();n.buffer=noiseBuf;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6500;const g=ctx.createGain();g.gain.setValueAtTime(.3*v,t);g.gain.exponentialRampToValueAtTime(.001,t+1.6);n.connect(hp);hp.connect(g);g.connect(out);n.start(t);n.stop(t+1.7);}
// 지휘 박 소리(딱): 박을 인식한 즉시 낸다. 1박은 조금 높게.
function tick(acc){
  const t=ctx.currentTime;
  const n=ctx.createBufferSource();n.buffer=noiseBuf;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=acc?3200:2600;bp.Q.value=4;
  const ng=ctx.createGain();ng.gain.setValueAtTime(.55,t);ng.gain.exponentialRampToValueAtTime(.001,t+.035);
  const o=ctx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(acc?1900:1450,t);o.frequency.exponentialRampToValueAtTime(acc?1300:1000,t+.04);
  const og=ctx.createGain();og.gain.setValueAtTime(.32,t);og.gain.exponentialRampToValueAtTime(.001,t+.05);
  n.connect(bp);bp.connect(ng);ng.connect(master);o.connect(og);og.connect(master);
  n.start(t);n.stop(t+.05);o.start(t);o.stop(t+.06);
}
function click(t,acc){const s=ctx.createOscillator();s.type='square';s.frequency.value=acc?1760:1320;const g=ctx.createGain();g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(g);g.connect(master);s.start(t);s.stop(t+.06);}
const BOW={violin:{att:.06,peak:.16,rel:.12,cut:4200,det:7},violin2:{att:.06,peak:.15,rel:.12,cut:3800,det:7},
           cello:{att:.08,peak:.22,rel:.15,cut:1800,det:6},cb:{att:.1,peak:.26,rel:.15,cut:900,det:5}};
function playNote(seat,t,m,dur,v){
  const out=seat.out,i=seat.inst;
  if(m===-1)return bdrum(t,v,out);
  if(m===-2)return cymbal(t,v,out);
  const f=mtof(m);
  if(BOW[i])return bowed(t,f,dur,v,out,BOW[i],seat.cents);
  if(i==='piano')return piano(t,f,dur,v,out);
  if(i==='flute')return flute(t,f,dur,v,out);
  if(i==='trumpet')return trumpet(t,f,dur,v,out);
  if(i==='timp')return timpani(t,f,v,out);
}

function startGame(songId,diff){
  const song=SONGS.find(s=>s.id===songId),C=compile(song,diff);

  // 좌석 오디오 체인
  C.seats.forEach(s=>{
    s.out=ctx.createGain();s.out.gain.value=1;
    let node=s.out;
    if(spatialOn()&&ctx.createPanner){
      // HRTF 3D 배치: 청취자(지휘자)는 원점에서 앞(-z)을 본다. 앞줄 2.5m, 한 줄 뒤마다 2.2m 멀어진다.
      const p=ctx.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=2.5;p.rolloffFactor=.6;
      const x=s.pan*4.2,z=-(2.5+s.row*2.2-Math.abs(s.pan)*.8);
      if(p.positionX){p.positionX.value=x;p.positionY.value=0;p.positionZ.value=z;}else p.setPosition(x,0,z);
      s.out.connect(p);node=p;
    }else if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=s.pan;s.out.connect(p);node=p;}

    errs:[],nextErrAt:ctx.currentTime+song.countIn*60/song.bars[0].tp+4,spawned:0,missed:0,caught:[],nf:0,
    scoreC:0,bonus:0,evaluated:-1,beatHits:0,ictus:new Map(),ivs:[],patOk:0,patBad:0,b1:null,lastPt:null,judge:null,sk:null,userLevel:.45,lastIctus:null,lastIctusBeat:null,

function scheduleEv(ev,t,now){
  const seat=G.seats[ev.seat];let m=ev.m,v=ev.v,tt=t;
  const err=G.errs.find(e=>e.seat===ev.seat&&!e.done);
  if(err){
    let applied=true;
    if(err.type==='pitch'){if(ev.m<0||(ev.ci!==undefined&&ev.ci!==err.ci))applied=false;else m=ev.m+err.shift/100;}
    else if(err.type==='timing'){tt=(err.off<0&&tt+err.off<now+.01)?tt-err.off:tt+err.off;}
    else if(err.type==='dyn'){v=ev.v*err.mul;}
    if(applied){
      if(err.firstAt==null){err.firstAt=tt;err.deadline=tt+G.cfg.T;}
      if(err.type==='mute'&&Math.random()<G.cfg.skip)return;   // 일부 음만 빠뜨려 '늦게/덜 들어오는' 느낌
    }
  }
  const sd=G.barDyn[barIndexAt(ev.b)];
  const lvl=.5*sd+.5*G.userLevel,gain=.3+.85*lvl;
  const dur=Math.min(ev.dp/Math.max(G.rate,G.baseRate*.5),3);
  const jit=(G.diff==='hard'&&seat.inst==='violin')?(Math.random()-.5)*.016:0;
  const at=Math.max(tt+jit,now);
  playNote(seat,at,m,dur,Math.min(1.25,v*gain));
  seat.on.push([at,at+Math.max(dur,.12),Math.min(1,v*gain)]);
}

function maybeSpawn(now){
  const c=G.cfg;
  if(now<G.nextErrAt||G.pos<1)return;
  if((G.totalBeats-G.pos)/G.rate<c.T+1.5)return;
  if(G.errs.filter(e=>!e.done).length>=c.maxErr)return;
  const winB=G.pos+3*G.rate,cnt={};
  for(let i=G.idx;i<G.events.length&&G.events[i].b<winB;i++){const s=G.events[i].seat;cnt[s]=(cnt[s]||0)+1;}
  const cands=G.seats.map((s,i)=>i).filter(i=>(cnt[i]||0)>=2&&!G.errs.some(e=>!e.done&&e.seat===i));
  if(!cands.length){G.nextErrAt=now+1;return;}
  const si=pick(cands),seatS=G.seats[si];
  // 선율을 혼자 맡은 단원은 음을 빼먹으면 너무 티가 나므로 입장 미스 제외
  const solo=seatS.role==='mel'&&G.seats.filter(x=>x.role==='mel').length===1;
  const types=INST[seatS.inst].errs.filter(t=>t!=='mute'||(cnt[si]>=3&&!solo));
  const type=pick(types),sd=G.barDyn[barIndexAt(G.pos)];
  G.errs.push({seat:si,type,created:now,firstAt:null,deadline:null,done:false,
    shift:(Math.random()<.5?-1:1)*c.cents,ci:G.diff==='hard'?1:0,
    off:(Math.random()<.6?1:-1)*c.off,mul:sd<=.6?c.loud:c.soft});
  G.spawned++;
  G.nextErrAt=now+c.gap[0]+Math.random()*(c.gap[1]-c.gap[0]);
}
function updateErrors(now){
  G.errs.forEach(e=>{
    if(e.done)return;
    if(e.firstAt==null&&now-e.created>4){e.done=true;G.spawned--;return;}
    if(e.deadline!=null&&now>e.deadline){e.done=true;G.missed++;flashSeat(e.seat,'miss');popup(e.seat,`놓침 · ${TYPE_KO[e.type]} 미스`,'miss');}
  });
}
function accuse(si){
  if(!G.running||G.pos<0)return;
  const now=ctx.currentTime;
  const e=G.errs.find(x=>!x.done&&x.seat===si&&x.firstAt!=null&&now>=x.firstAt-.05);
  if(e){
    e.done=true;const dt=Math.max(0,now-e.firstAt);
    const B=Math.max(10,Math.round(B0[e.type]*G.cfg.k*(1-dt/G.cfg.T)));
    G.bonus+=B;G.caught.push({type:e.type,B,dt});
    flashSeat(si,'hit');popup(si,`+${B} ${TYPE_KO[e.type]} 미스 적발!`,'good');
  }else{
    G.nf++;flashSeat(si,'miss');popup(si,`−${G.cfg.P} 오지적`,'bad');
  }
}

function scoreBeat(k){
  if(!G.ictus.has(k))return;
  G.patOk++;
  const bi=barIndexAt(k),tr=G.song.bars[bi].tp/60,tl=G.barDyn[bi];
  const ta=Math.max(0,1-Math.abs(G.baseRate/tr-1)/.25);
  const da=Math.max(0,1-Math.abs(G.userLevel-tl)/.4);
  G.scoreC+=Math.round(10*ta+5*da);
}

/* ---------------------------------------------------------
   박 ↔ 시각 대응: '예약 경계(frontier)'까지는 이미 소리를 예약했으므로
   템포 변경은 경계 이후에만 적용한다 → 음 순서가 뒤바뀌거나 겹치지 않는다.
   --------------------------------------------------------- */
function posAt(t){
  const h=G.hist;
  if(t<=h[0][0])return h[0][1]-(h[0][0]-t)*G.rate;
  for(let i=h.length-1;i>0;i--){
    if(t>=h[i-1][0]){const [t0,b0]=h[i-1],[t1,b1]=h[i];return t1>t0?b0+(b1-b0)*Math.min(1,(t-t0)/(t1-t0)):b1;}
  }
  return h[h.length-1][1];
}
function onIctus(amp,at,x,y){
  if(!G.running)return;
  const real=ctx.currentTime;
  if(at==null||at>real)at=real;
  const tr=G.song.bars[barIndexAt(Math.max(0,G.pos))].tp/60;
  // 1) 0.45박 안의 두 번째 입력은 무시 (기준 템포는 목표의 1.2배를 넘지 않게 묶어 폭주 방지)
  if(G.lastIctus!=null&&(at-G.lastIctus)<Math.max(.26,.45/Math.min(G.baseRate,tr*1.2)))return;
  // 2) 소리는 출력 지연(블루투스 이어폰 등)만큼 늦게 들리므로, 들은 소리 기준 박 위치로 환산
  const lat=(ctx.outputLatency||0)+(ctx.baseLatency||0);
  const pa=posAt(at-lat);
  // 3) 박 번호는 지휘자가 센다: 직전 지휘 박의 다음 박. (오래 쉬었다 다시 저으면 들리는 위치로 다시 맞춤)
  //    오케스트라 위치를 반올림해 번호를 붙이면, 지휘자가 늦거나 빠를 때 박이 하나씩 밀려 도형 판정이 어긋난다.
  const fresh=G.lastIctus==null||(at-G.lastIctus)*G.baseRate>1.7;
  const n=fresh?Math.round(pa):G.lastIctusBeat+1,err=n-pa;
  if(fresh&&G.lastIctusBeat!=null&&n<=G.lastIctusBeat)return;
  // 4) 템포: 연속한 박(또는 1박 건너뜀) 간격만 사용, 한 번에 ±25%까지, 지수 평활
  if(G.lastIctus!=null){
    const gap=n-G.lastIctusBeat,dt=at-G.lastIctus;
    if(gap>=1&&gap<=2&&dt>.2){
      // 방금 친 박 간격을 바로 반영 (빨라질 때도 느려질 때도 같은 속도로 따라감)
      let inst=clamp(gap/dt,tr*.4,tr*1.8);
      inst=clamp(inst,G.baseRate*.7,G.baseRate*1.3);
      G.baseRate=.35*G.baseRate+.65*inst;
    }
  }
  G.baseRate=clamp(G.baseRate,tr*.4,tr*1.8);
  // 5) 위상 보정
  // 오케스트라는 탭 전에는 다음 박에 들어가지 않으므로(아래 loop), 탭이 일찍 왔을 때만 따라잡는다
  const errF=n-G.fB;
  G.corr=errF>.06?clamp(errF*.8,0,.4):0;G.corrUntil=G.fB+1;
  G.rate=G.baseRate*(1+G.corr);
  if(amp!=null)G.userLevel=.4*G.userLevel+.6*amp;          // 탭 높이 = 셈여림(위 ff ~ 아래 pp)
  const bpb=G.Q/G.qpb,k=((n%bpb)+bpb)%bpb,ok=Math.abs(err)<.2;  // ok: 오케스트라 박과 잘 맞았는지(표시용)
  G.ictus.set(n,true);
  G.judge={k,ok,t:performance.now()};
  if(tickOn())tick(k===0);
  if(k===0)G.b1={x,y};G.lastPt={x,y};
  G.lastIctus=at;G.lastIctusBeat=n;
  G.ripples.push({x,y,t:performance.now(),ok});
}

function loop(){
  if(!G.running)return;
  const now=ctx.currentTime,H=now+LOOK;
  if(G.corrUntil!=null&&G.fB>=G.corrUntil){G.corr=0;G.corrUntil=null;}
  // 지휘를 기다림: 마지막 지휘 박 다음 박에서 0.35박 넘게 앞서 나가지 않는다.
  // 지휘가 늦어지면 그 앞에서 점점 느려져 멈추고, 다음 박이 들어오면 거기서 다시 따라간다.
  // 탭이 박이다: 오케스트라는 다음 탭이 올 때까지 다음 박에 들어가지 않는다(직전에서 기다림).
  // 첫 탭 전에는 준비 박만 치고 1박 직전에서 기다린다.
  const allowF=G.lastIctusBeat!=null?G.lastIctusBeat+.97:-.01,hold=clamp((allowF-G.fB)/.06,0,1);
  G.rate=G.baseRate*(1+G.corr)*hold;
  if(H>G.fT){
    const nB=G.fB+(H-G.fT)*G.rate,tAt=b=>G.fT+(b-G.fB)/G.rate;
    while(G.nextClick<0&&G.nextClick<nB){const t=tAt(G.nextClick);if(t>=now-.01)click(Math.max(t,now),G.nextClick===-G.song.countIn);G.nextClick++;}
    while(G.idx<G.events.length&&G.events[G.idx].b<nB){const ev=G.events[G.idx++];scheduleEv(ev,tAt(ev.b),now);}
    G.fB=nB;G.fT=H;G.hist.push([H,nB]);if(G.hist.length>60)G.hist.shift();
  }
  G.pos=posAt(now);
  let k=G.evaluated+1;
  while(k<G.totalBeats&&G.pos>=k+.5){scoreBeat(k);G.evaluated=k;k++;}
  updateErrors(now);maybeSpawn(now);
  render(now);
  if(G.pos>=G.totalBeats+1.2){finish();return;}
  requestAnimationFrame(loop);
}

/* =========================================================
   7. 지휘 입력
   ========================================================= */
const pad=$('pad'),pctx=pad.getContext('2d');
function resizePad(){
  const r=pad.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  pad.width=Math.round(r.width*dpr);pad.height=Math.round(r.height*dpr);pctx.setTransform(dpr,0,0,dpr,0,0);
  G.padW=r.width;G.padH=r.height;
}
window.addEventListener('resize',()=>{if(G.running)resizePad();});
// 입력 이벤트 시각(ms) → 오디오 시계(초)
const evAudio=ms=>ctx.currentTime-Math.max(0,performance.now()-ms)/1000;
function padXY(e){const r=pad.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
const padS=()=>Math.min(G.padW,G.padH);
/* 지휘법 판정 (오른손, 지휘자 시점)
   4/4: 1↓ 2← 3→ 4↑   3/4: 1↓ 2→ 3↑
   직전 박 지점(p)에서 얼마나, 어느 쪽으로 움직였는지 본다. d = 지휘대 짧은 변의 7%. */
function judgePattern(k,x,y,bpb){
  const p=G.lastPt,d=.07*padS();
  if(!p)return k===0;
  const dx=x-p.x,dy=y-p.y;
  if(k===0)return dy>d;                       // 1: 아래로
  if(k===bpb-1)return -dy>d;                  // 마지막 박: 위로
  if(bpb===4)return k===1?-dx>d:dx>1.5*d;     // 4/4 2: 왼쪽, 3: 오른쪽(가로질러)
  return dx>d;                                // 3/4 2: 오른쪽
}
/* 박점(ictus) 감지: 속도가 붙은 획이 멈칫하며(속도 최소점) 방향이 60° 넘게 꺾이는 순간.
   - 리바운드 꼭대기에서 잘못 잡히지 않게: 직전 박 뒤 0.55박 이내는 무시, 거의 수직으로 올라오다 꺾인 점도 무시 */
function resetStroke(x,y,ms){G.sk={sx:x,sy:y,peak:0,ext:0,hist:[],lastMs:ms};}
function fireIctus(h){
  const sk=G.sk;onIctus(sk.ext,evAudio(h.ms),h.x,h.y);resetStroke(h.x,h.y,h.ms);
}
function moveSample(x,y,ms){
  const dt=Math.max(1,ms-G.pt);
  G.vx=.5*G.vx+.5*((x-G.px)/dt);G.vy=.5*G.vy+.5*((y-G.py)/dt);
  G.px=x;G.py=y;G.pt=ms;
  const sk=G.sk,sp=Math.hypot(G.vx,G.vy);
  sk.hist.push({x,y,ms,vx:G.vx,vy:G.vy,sp});while(sk.hist.length&&ms-sk.hist[0].ms>140)sk.hist.shift();
  sk.peak=Math.max(sk.peak,sp);sk.ext=Math.max(sk.ext,Math.hypot(x-sk.sx,y-sk.sy));
  if(sp>.3*sk.peak){sk.mvx=G.vx;sk.mvy=G.vy;sk.msp=sp;}                     // 마지막으로 '움직이던' 방향
  const tr=G.song.bars[barIndexAt(Math.max(0,G.pos))].tp/60;
  const D=.07*padS(),gate=G.lastIctus!=null?Math.max(240,(.42/Math.min(G.baseRate,tr*1.2))*1000):120;
  if(ms-sk.lastMs<Math.max(110,gate)||sk.ext<D||sk.peak<.08)return;
  const win=sk.hist.filter(h=>ms-h.ms<=100);
  const old=win[0],mn=win.reduce((a,h)=>h.sp<a.sp?h:a,win[0]);
  // 박점에서 멈칫한 경우 — 단, 거의 수직으로 올라와 멈춘 점(예비박 꼭대기)은 박이 아니다
  if(sp<Math.max(.02,.15*sk.peak)){fireIctus(mn);return;}                // 박점에서 멈칫한 경우
  if(!old||old.sp<.25*sk.peak||sp<.25*sk.peak)return;
  const cos=(old.vx*G.vx+old.vy*G.vy)/(old.sp*sp);
  // 크게 꺾이면(60°↑) 살짝만 느려져도, 덜 꺾이면(35°↑) 확실히 멈칫해야 박으로 본다
  if((cos<.5&&mn.sp<.55*sk.peak)||(cos<.82&&mn.sp<.35*sk.peak))fireIctus(mn);
}
// 탭 = 박. 탭한 높이로 셈여림을 정한다(위 = 크게, 아래 = 작게). 여러 손가락 동시 사용 가능.
pad.addEventListener('pointerdown',e=>{
  if(!G.running)return;e.preventDefault();
  const [x,y]=padXY(e),ms=e.timeStamp||performance.now();
  const lv=clamp(1-(y-G.padH*.08)/(G.padH*.84),0,1);
  onIctus(lv,evAudio(ms),x,y);
});

// 탭 지휘대: 왼쪽 셈여림 눈금(목표·현재), 가운데 박 표시
function drawTapPad(W,H,t){
  const bpb=G.Q/G.qpb,top=H*.08,span=H*.84,yOf=v=>top+(1-v)*span;
  pctx.save();
  // 셈여림 눈금
  pctx.font='italic 700 13px "Times New Roman",serif';pctx.textAlign='left';pctx.textBaseline='middle';
  DYN_NAMES.forEach(([nm,v])=>{const y=yOf(v);pctx.fillStyle='rgba(231,194,125,.35)';pctx.fillText(nm,12,y);
    pctx.strokeStyle='rgba(231,194,125,.08)';pctx.lineWidth=1;pctx.beginPath();pctx.moveTo(40,y);pctx.lineTo(W-12,y);pctx.stroke();});
  const bi=barIndexAt(Math.max(0,G.pos)),tg=G.barDyn[bi];
  pctx.strokeStyle='rgba(231,194,125,.5)';pctx.lineWidth=2;pctx.setLineDash([6,6]);pctx.beginPath();pctx.moveTo(40,yOf(tg));pctx.lineTo(W-12,yOf(tg));pctx.stroke();pctx.setLineDash([]);
  pctx.fillStyle='rgba(231,194,125,.6)';pctx.font='600 11px -apple-system,sans-serif';pctx.textAlign='right';pctx.fillText('목표 '+dynName(tg),W-14,yOf(tg)-10);
  pctx.fillStyle='rgba(255,240,205,.85)';pctx.beginPath();pctx.arc(34,yOf(G.userLevel),5,0,Math.PI*2);pctx.fill();
  // 박 표시
  // 박 표시는 내 탭 기준: 다음에 칠 박 = 마지막으로 친 박 + 1 (탭 전에는 준비 박을 따라감)
  const cur=G.lastIctusBeat!=null?G.lastIctusBeat+1:(G.pos<-.05?Math.floor(G.pos):0);
  const next=((cur%bpb)+bpb)%bpb,j=G.judge&&t-G.judge.t<300?G.judge:null;
  const r=Math.min(26,W/(bpb*4)),gap=r*3.2,x0=W/2-gap*(bpb-1)/2,cy=H*.5;
  for(let i=0;i<bpb;i++){
    let fill='rgba(231,194,125,.1)',txt='rgba(231,194,125,.4)',rr=r*(i===0?1.15:1);
    if(i===next){fill='rgba(231,194,125,.28)';txt='rgba(255,240,205,.9)';}
    if(j&&j.k===i){fill=j.ok?'rgba(127,217,154,.6)':'rgba(255,190,90,.6)';txt='#fff';rr*=1.15;}
    pctx.fillStyle=fill;pctx.beginPath();pctx.arc(x0+i*gap,cy,rr,0,Math.PI*2);pctx.fill();
    pctx.fillStyle=txt;pctx.font=`700 ${Math.round(rr)}px -apple-system,sans-serif`;pctx.textAlign='center';pctx.fillText(i+1,x0+i*gap,cy+1);
  }

}
// (이전 도형 방식 — 사용 안 함)
// 지휘 도형 (반투명 안내): 박마다 꺾이는 지점. 마지막 박은 위(꼭대기), 거기서 1박으로 내려친다.
// pts = 박 지점(정규화 좌표), ctrl[i] = pts[i]→pts[i+1] 곡선 제어점
const PATTERN={
  4:{pts:[[.5,.86],[.17,.56],[.83,.56],[.5,.12]],ctrl:[[.27,.84],[.5,.7],[.74,.24]]},
  3:{pts:[[.5,.86],[.83,.56],[.5,.12]],ctrl:[[.74,.84],[.73,.24]]}
};
function drawPattern(W,H,t){
  const bpb=G.Q/G.qpb,P=PATTERN[bpb];if(!P)return;
  const S=Math.min(W,H)*.9,ox=(W-S)/2,oy=(H-S)/2+6,X=v=>ox+v[0]*S,Y=v=>oy+v[1]*S,L=P.pts.length;
  pctx.save();pctx.lineWidth=Math.max(3,S*.012);pctx.lineCap='round';pctx.strokeStyle='rgba(231,194,125,.22)';pctx.setLineDash([10,9]);
  pctx.beginPath();pctx.moveTo(X(P.pts[L-1]),Y(P.pts[L-1]));pctx.lineTo(X(P.pts[0]),Y(P.pts[0]));
  for(let i=1;i<L;i++)pctx.quadraticCurveTo(X(P.ctrl[i-1]),Y(P.ctrl[i-1]),X(P.pts[i]),Y(P.pts[i]));
  pctx.stroke();pctx.setLineDash([]);
  // 진행 방향 화살표(각 구간 중간)
  pctx.fillStyle='rgba(231,194,125,.3)';
  const arrow=(x0,y0,x1,y1)=>{const a=Math.atan2(y1-y0,x1-x0),z=Math.max(7,S*.025);pctx.save();pctx.translate(x1,y1);pctx.rotate(a);pctx.beginPath();pctx.moveTo(0,0);pctx.lineTo(-z,-z*.6);pctx.lineTo(-z,z*.6);pctx.fill();pctx.restore();};
  {const a=P.pts[L-1],b=P.pts[0];arrow(X(a),Y(a),(X(a)+X(b))/2,(Y(a)+Y(b))/2);}
  for(let i=1;i<L;i++){const a=P.pts[i-1],c=P.ctrl[i-1],b=P.pts[i],q=u=>[(1-u)*(1-u)*a[0]+2*(1-u)*u*c[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*c[1]+u*u*b[1]];
    const m0=q(.47),m1=q(.53);arrow(X(m0),Y(m0),X(m1),Y(m1));}
  // 다음에 칠 박 강조, 방금 친 박 판정 표시
  const next=((Math.floor(G.pos+.5)+1)%bpb+bpb)%bpb,j=G.judge&&t-G.judge.t<450?G.judge:null;
  P.pts.forEach((v,i)=>{
    const r=Math.max(13,S*.045);let fill='rgba(231,194,125,.14)',txt='rgba(231,194,125,.45)';
    if(i===next){fill='rgba(231,194,125,.32)';txt='rgba(255,240,205,.9)';}
    if(j&&j.k===i){fill=j.ok?'rgba(127,217,154,.55)':'rgba(255,122,107,.55)';txt='#fff';}
    pctx.fillStyle=fill;pctx.beginPath();pctx.arc(X(v),Y(v),r,0,Math.PI*2);pctx.fill();
    pctx.fillStyle=txt;pctx.font=`700 ${Math.round(r*1.05)}px -apple-system,sans-serif`;pctx.textAlign='center';pctx.textBaseline='middle';pctx.fillText(i+1,X(v),Y(v)+1);
  });
  pctx.restore();
}

  const caught=G.caught.length,spawned=Math.max(G.spawned,caught);

  const avgDt=caught?(G.caught.reduce((a,x)=>a+x.dt,0)/caught).toFixed(2):'—';
  const best=loadBest(),key=G.song.id+'/'+G.diff,isBest=best[key]==null||S>best[key];
  if(isBest){best[key]=S;saveBest(best);}
  const cloudOld=Acc.cloud[key],cloudBest=cloudOld==null||S>cloudOld;
  const byType=Object.keys(TYPE_KO).map(t=>{const n=G.caught.filter(x=>x.type===t).length;return n?`${TYPE_KO[t]} ${n}`:null;}).filter(Boolean).join(', ')||'없음';
  $('resBox').innerHTML=`
    <div style="text-align:center;color:var(--dim);font-size:13px">${G.song.title} · ${c.name}</div>
    <div class="grade">${grade}</div>
    <div class="formula">S = S<sub>c</sub> + ΣB<sub>i</sub> − n<sub>f</sub>·P</div>
    <table class="res">
      <tr><td>S<sub>c</sub> 지휘 점수 (만점 ${maxC})</td><td>${G.scoreC}</td></tr>
      <tr><td>ΣB<sub>i</sub> 적발 보너스</td><td>+${G.bonus}</td></tr>
      <tr><td>n<sub>f</sub>·P 오지적 (${G.nf}회 × ${c.P})</td><td>−${pen}</td></tr>
      <tr class="tot"><td>S 총점 ${(Acc.user?cloudBest:isBest)?'· 최고 기록!':''}</td><td>${S}</td></tr>
    </table>
    <p class="note">적발 ${caught}/${spawned} (${byType}) · 놓침 ${G.missed} · 평균 적발 시간 Δt ${avgDt}초<br>
    지휘한 박 ${G.patOk}/${G.totalBeats}</p>
    <p class="note" id="cloudNote">${Acc.user?'기록 저장 중…':(Acc.sb?'로그인하면 기록이 계정에 저장된다.':'')}</p>
    <div class="btns"><button id="rMenu">메뉴</button><button class="pri" id="rAgain">다시 하기</button></div>`;

  });

  if(/Password should be/i.test(m))return '비밀번호는 6자 이상이어야 한다.';
  if(/rate limit|too many/i.test(m))return '요청이 너무 잦다. 잠시 후 다시 시도하라.';
  if(/valid email|invalid.*email/i.test(m))return '이메일 형식이 올바르지 않다.';
  return '오류: '+m;
}
function openAuth(mode){
  const box=$('authBox');
  const nickF=`<label class="field"><span>닉네임 (2~12자)</span><input id="aNick" maxlength="12" autocomplete="nickname"></label>`;
  if(mode==='nick'){
    box.innerHTML=`<h2 style="margin-top:0">닉네임 정하기</h2><p class="note" style="margin-top:0">이 계정으로 Maestro를 처음 쓴다. 게임에서 쓸 닉네임을 정하라.</p>${nickF}
      <div class="msg" id="aMsg"></div><div class="btns"><button id="aCancel">나중에</button><button class="pri" id="aGo">저장</button></div>`;
  }else{
    const su=mode==='signup';
    box.innerHTML=`<div class="tabs"><button id="tLogin" class="${su?'':'on'}">로그인</button><button id="tSignup" class="${su?'on':''}">회원가입</button></div>
      ${su?nickF:''}
      <label class="field"><span>이메일</span><input id="aEmail" type="email" autocomplete="email" inputmode="email"></label>
      <label class="field"><span>비밀번호${su?' (6자 이상)':''}</span><input id="aPw" type="password" autocomplete="${su?'new-password':'current-password'}"></label>
      ${su?'<label class="field"><span>비밀번호 확인</span><input id="aPw2" type="password" autocomplete="new-password"></label>':''}
      <div class="msg" id="aMsg"></div>
      <div class="btns"><button id="aCancel">닫기</button><button class="pri" id="aGo">${su?'가입하기':'로그인'}</button></div>
      <p class="note">카나미치·SEED 10K 등과 같은 계정 시스템을 쓴다. 이미 그쪽 계정이 있으면 그대로 로그인하면 된다.</p>`;
    $('tLogin').onclick=()=>openAuth('login');$('tSignup').onclick=()=>openAuth('signup');
  }
  $('auth').classList.remove('hidden');
  $('aCancel').onclick=()=>$('auth').classList.add('hidden');
  const msg=(t,ok)=>{const m=$('aMsg');m.textContent=t;m.className='msg '+(ok?'ok':'err');};
  const busy=b=>{$('aGo').disabled=b;$('aGo').style.opacity=b?.6:1;};
  $('aGo').onclick=async()=>{
    try{
      busy(true);
      if(mode==='nick'){
        const n=$('aNick').value.trim();
        if(n.length<2||n.length>12){msg('닉네임은 2~12자로 정하라.');return;}
        const r=await saveNick(n);if(r){msg(r);return;}
        $('auth').classList.add('hidden');renderMenu();return;
      }
      const email=$('aEmail').value.trim(),pw=$('aPw').value;
      if(!email||!pw){msg('이메일과 비밀번호를 입력하라.');return;}
      if(mode==='login'){
        const {error}=await Acc.sb.auth.signInWithPassword({email,password:pw});
        if(error){msg(authErr(error));return;}
        $('auth').classList.add('hidden');return;
      }
      const n=$('aNick').value.trim();
      if(n.length<2||n.length>12){msg('닉네임은 2~12자로 정하라.');return;}
      if(pw.length<6){msg('비밀번호는 6자 이상이어야 한다.');return;}
      if(pw!==$('aPw2').value){msg('비밀번호 확인이 일치하지 않는다.');return;}
      const {data,error}=await Acc.sb.auth.signUp({email,password:pw,options:{data:{maestro_nick:n},emailRedirectTo:location.href.split('#')[0]}});
      if(error){msg(authErr(error));return;}
      if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){msg('이미 가입된 이메일이다. 로그인 탭에서 로그인하라.');return;}
      if(data.session){$('auth').classList.add('hidden');return;}
      msg('가입 완료. 인증 메일을 보냈다 — 메일의 링크를 누른 뒤 로그인하라.',true);
    }catch(e){msg(authErr(e));}
    finally{busy(false);}
  };
}
async function saveNick(n){
  const {error}=await Acc.sb.from('maestro_profiles').upsert({user_id:Acc.user.id,nickname:n});
  if(error)return error.code==='23505'?'이미 누가 쓰는 닉네임이다. 다른 걸 골라라.':'닉네임 저장 실패: '+error.message;
  Acc.nick=n;return null;
}
async function afterLogin(){
  const uid=Acc.user.id;
  const {data:prof}=await Acc.sb.from('maestro_profiles').select('nickname').eq('user_id',uid).maybeSingle();
  if(prof)Acc.nick=prof.nickname;
  else{
    const want=Acc.user.user_metadata&&Acc.user.user_metadata.maestro_nick;
    if(want&&!(await saveNick(want))){}else{renderMenu();openAuth('nick');}
  }
  // 기록 동기화: 계정 기록을 받아오고, 이 기기 기록이 더 높으면 올린다
  const {data:rows}=await Acc.sb.from('maestro_records').select('song,diff,best');
  Acc.cloud={};(rows||[]).forEach(r=>Acc.cloud[r.song+'/'+r.diff]=r.best);
  const local=loadBest();
  for(const k in local){
    if(Acc.cloud[k]==null||local[k]>Acc.cloud[k]){const [song,diff]=k.split('/');await submitRecord(song,diff,local[k],null,{from:'local'});}
  }
  renderMenu();
}
async function submitRecord(song,diff,score,grade,detail){
  if(!Acc.user)return null;
  const {data,error}=await Acc.sb.rpc('maestro_submit',{p_song:song,p_diff:diff,p_score:score,p_grade:grade,p_detail:detail});
  if(error){console.warn(error);return null;}
  Acc.cloud[song+'/'+diff]=data;return data;
}
if(Acc.sb){
  Acc.sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null,changed=(u&&u.id)!==(Acc.user&&Acc.user.id);
    Acc.user=u;
    if(!u){Acc.nick=null;Acc.cloud={};renderMenu();return;}
    if(changed)setTimeout(()=>afterLogin().catch(e=>console.warn(e)),0);   // 콜백 안에서 바로 await하면 교착될 수 있어 분리
  });
}

renderMenu();
</script>
